name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Omarchy is Arch-based, so test against Arch.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git python python-coverage ruff shellcheck qt6-declarative
      - uses: actions/checkout@v4
      - name: Let git read the checkout (the container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Python lint
        run: ruff check bin/redial-hypr bin/redial-rise-widget scripts/add-menu-entry.py tests
      - name: Python format
        run: ruff format --check bin/redial-hypr bin/redial-rise-widget scripts/add-menu-entry.py tests
      - name: Shell lint
        run: shellcheck install.sh uninstall.sh scripts/make-installer.sh scripts/installer-template.sh bin/redial-setup bin/redial-restart bin/redial-bar scripts/pair-dial.sh
      - name: Tests (with a coverage floor)
        run: |
          coverage run --include=bin/redial-hypr tests/test_dial.py
          coverage report --fail-under=75
      - name: QML component tests
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/qml
      - name: QML lint (informational)
        # Quickshell's modules aren't installable in CI, so import warnings are expected.
        continue-on-error: true
        run: qmllint plugin/redial/*.qml
