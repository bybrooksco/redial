name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Omarchy is Arch-based, so test against Arch.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git python ruff shellcheck qt6-declarative
      - uses: actions/checkout@v4
      - name: Python lint
        run: ruff check bin/surface-dial-hypr bin/surface-dial-rise-widget tests
      - name: Python format
        run: ruff format --check bin/surface-dial-hypr bin/surface-dial-rise-widget tests
      - name: Shell lint
        run: shellcheck install.sh bin/surface-dial-setup bin/surface-dial-bar scripts/pair-dial.sh
      - name: Tests
        run: python3 tests/test_dial.py
      - name: QML lint (informational)
        # Quickshell's modules aren't installable in CI, so import warnings are expected.
        continue-on-error: true
        run: qmllint plugin/dial.radial/*.qml
